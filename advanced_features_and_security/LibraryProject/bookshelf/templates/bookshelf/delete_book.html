<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Book</title>
</head>
<body>
    <h1>Delete Book</h1>
    
    <p>Are you sure you want to delete "{{ book.title|escape }}" by {{ book.author|escape }}?</p>
    
    <form method="post">
        {% csrf_token %}
        
        <p>
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'bookshelf:book_detail' book.pk %}">Cancel</a>
        </p>
    </form>
</body>
</html>
