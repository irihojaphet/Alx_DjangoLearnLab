{% extends 'blog/base.html' %}

{% block title %}Login - Django Blog{% endblock %}

{% block content %}
<h1>Login</h1>
<form method="post" class="auth-form">
    {% csrf_token %}
    <div class="form-group">
        <label for="id_username">Username:</label>
        <input type="text" name="username" id="id_username" class="form-control" required autofocus>
    </div>
    <div class="form-group">
        <label for="id_password">Password:</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
    </div>
    {% if form.non_field_errors %}
        <div class="error-message">
            {% for error in form.non_field_errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}
    <button type="submit" class="btn btn-primary">Login</button>
    <p class="auth-link">Don't have an account? <a href="{% url 'blog:register' %}">Register here</a></p>
</form>
{% endblock %}
